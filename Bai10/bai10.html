
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 10 - Trang liên hệ</title>
    <link rel="stylesheet" href="bai10.css">
</head>
<body>
    <main class="form-card">
        <header>
            <h1>Liên hệ với chúng tôi</h1>
            <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
        </header>

        <form id="contactForm">
            <div class="fields">
                <div class="field">
                    <label for="name">Họ và tên</label>
                    <input type="text" id="name" name="name"
                           placeholder="Nhập họ và tên" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="name@email.com" required>
                </div>

                <div class="field">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="0123 456 789" required>
                </div>

                <div class="field">
                    <label for="subject">Chủ đề</label>
                    <select id="subject" name="subject" required>
                        <option value="">-- Chọn chủ đề --</option>
                        <option value="support">Hỏi về khóa học</option>
                        <option value="feedback">Góp ý</option>
                        <option value="cooperation">Hợp tác</option>
                        <option value="other">Khác</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label for="content">Nội dung</label>
                <textarea id="content" name="content" rows="4"
                          placeholder="Nhập nội dung liên hệ..." required></textarea>
            </div>

            <label class="consent">
                <input type="checkbox" id="agree" required>
                Tôi đồng ý với các điều khoản liên hệ.
            </label>

            <div class="buttons">
                <button class="send" type="submit">Gửi</button>
                <button class="reset" type="reset">Nhập lại</button>
            </div>

            <p id="message" role="status"></p>
        </form>
    </main>
</body>
</html>
