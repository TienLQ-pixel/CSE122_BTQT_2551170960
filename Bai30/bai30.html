<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 30 - Bảng điều khiển (Dashboard)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bai30.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse text-white p-3 min-vh-100">
                <h4 class="fw-bold text-center py-3">CSE.TLU Admin</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item"><a href="#" class="nav-link text-white active bg-primary rounded">Bảng điều khiển</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-white">Bài tập</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-white">Sinh viên</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-white">Điểm số</a></li>
                </ul>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h3 fw-bold">Bảng điều khiển</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button type="button" class="btn btn-sm btn-outline-secondary">Xuất báo cáo</button>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 p-3">
                            <h6 class="text-muted small">Sinh viên</h6>
                            <h3 class="fw-bold mb-0">128</h3>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 p-3">
                            <h6 class="text-muted small">Đã nộp</h6>
                            <h3 class="fw-bold mb-0 text-success">96</h3>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 p-3">
                            <h6 class="text-muted small">Chưa nộp</h6>
                            <h3 class="fw-bold mb-0 text-danger">32</h3>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 p-3">
                            <h6 class="text-muted small">Điểm TB</h6>
                            <h3 class="fw-bold mb-0 text-primary">7.8</h3>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0 p-4">
                    <h5 class="fw-bold mb-3">Tiến độ theo chương</h5>
                    
                    <label class="small fw-semibold mb-1">Chương 1 - HTML5</label>
                    <div class="progress mb-3" style="height: 10px;">
                        <div class="progress-bar bg-primary" style="width: 100%;">100%</div>
                    </div>

                    <label class="small fw-semibold mb-1">Chương 2 - JavaScript</label>
                    <div class="progress mb-3" style="height: 10px;">
                        <div class="progress-bar bg-success" style="width: 82%;">82%</div>
                    </div>

                    <label class="small fw-semibold mb-1">Chương 3 - CSS3</label>
                    <div class="progress mb-3" style="height: 10px;">
                        <div class="progress-bar bg-warning text-dark" style="width: 74%;">74%</div>
                    </div>

                    <label class="small fw-semibold mb-1">Chương 4 - Bootstrap 5</label>
                    <div class="progress" style="height: 10px;">
                        <div class="progress-bar bg-danger" style="width: 45%;">45%</div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
