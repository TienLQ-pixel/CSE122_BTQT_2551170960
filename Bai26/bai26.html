<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26 - Form đăng ký với Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bai26.css">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 700px;">
        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0 fw-bold">Đăng ký tham gia CLB Lập trình Web</h4>
            </div>
            <div class="card-body p-4">
                <form class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Họ và tên</label>
                        <input type="text" class="form-control" placeholder="Nguyễn Văn A" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Mã sinh viên</label>
                        <input type="text" class="form-control" placeholder="22xxxxxx" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Email</label>
                        <input type="email" class="form-control" placeholder="sv@tlu.edu.vn" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Số điện thoại</label>
                        <input type="tel" class="form-control" placeholder="09xxxxxxxx" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold small d-block">Trình độ</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="trinhDo" id="coban" checked>
                            <label class="form-check-label" for="coban">Cơ bản</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="trinhDo" id="kha">
                            <label class="form-check-label" for="kha">Khá</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="trinhDo" id="tot">
                            <label class="form-check-label" for="tot">Tốt</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold small">Chọn lớp</label>
                        <select class="form-select">
                            <option selected>67CNTT1</option>
                            <option>67CNTT2</option>
                            <option>67KTPM1</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="camKet" required>
                            <label class="form-check-label small" for="camKet">
                                Tôi cam kết tự làm bài và quay video OBS
                            </label>
                        </div>
                    </div>
                    <div class="col-12 text-end mt-4">
                        <button type="reset" class="btn btn-outline-secondary px-4 me-2">Nhập lại</button>
                        <button type="submit" class="btn btn-success px-4">Đăng ký</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
