<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 16 - Danh sách việc cần làm</title>
    <link rel="stylesheet" href="bai16.css">
</head>
<body>
    <div class="todo-app">
        <header class="todo-header">
            <h1>Danh sách việc cần làm</h1>
            <p>Thêm công việc và đánh dấu hoàn thành hoặc xóa -- tất cả bằng JavaScript</p>
        </header>

        <div class="todo-input">
            <input type="text" id="taskInput" placeholder="Nhập công việc cần làm...">
            <button id="addButton">Thêm</button>
        </div>

        <ul id="taskList"></ul>

        <p id="remaining">Còn 0 việc chưa hoàn thành</p>
    </div>

    <script>
        const taskInput = document.getElementById("taskInput");
        const addButton = document.getElementById("addButton");
        const taskList = document.getElementById("taskList");
        const remaining = document.getElementById("remaining");

        function updateRemaining() {
            const tasks = taskList.querySelectorAll("li");
            let count = 0;

            tasks.forEach(function(task) {
                if (!task.classList.contains("completed")) {
                    count++;
                }
            });

            remaining.textContent = "Còn " + count + " việc chưa hoàn thành";
        }

        function addTask() {
            const text = taskInput.value.trim();

            if (text === "") {
                taskInput.focus();
                return;
            }

            const li = document.createElement("li");

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";

            const taskName = document.createElement("span");
            taskName.textContent = text;

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Xóa";
            deleteButton.className = "delete-button";

            checkbox.addEventListener("change", function() {
                li.classList.toggle("completed", checkbox.checked);
                updateRemaining();
            });

            taskName.addEventListener("click", function() {
                checkbox.checked = !checkbox.checked;
                li.classList.toggle("completed", checkbox.checked);
                updateRemaining();
            });

            deleteButton.addEventListener("click", function() {
                li.remove();
                updateRemaining();
            });

            li.appendChild(checkbox);
            li.appendChild(taskName);
            li.appendChild(deleteButton);

            taskList.appendChild(li);

            taskInput.value = "";
            taskInput.focus();

            updateRemaining();
        }

        addButton.addEventListener("click", addTask);

        taskInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });
    </script>
</body>
</html>
