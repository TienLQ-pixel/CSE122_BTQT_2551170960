<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="URF-8">
        <title>BỐN MÙA</title>
        <link rel="stylesheet" href="bai1.css">
    </head>
    <body>
        <div class="khung">
            <h1>BỐN MÙA</h1>
            <div class="kho xanh">
                Xuân về hoa nở khắp trời<br>
                Hạ sang nắng cháy rạng ngời phố quen<br>
                Thu về lá rụng bên thềm<br>
            </div>
            <hr>
            <div class="kho do">
                Đông sang gió lạnh bên em đợi chờ<br>
                Bốn mùa là bốn giấc mơ<br>
                Thời gian đi mãi ta chờ đợi ai<br>
            </div>
            <hr>
            <div class="kho xanh">
                Một năm rồi lại một nămL<br>
                Vẫn còn câu hát thì thầm quê hương<br>
                Chờ xuân nắng mới soi đườn<br>
            </div>
        </div>
    </body>
</html>
